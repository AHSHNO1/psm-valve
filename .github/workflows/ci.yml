name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          JWT_SECRET: ci-only-secret-please-never-use-in-prod-0123456789
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-only-password-123
