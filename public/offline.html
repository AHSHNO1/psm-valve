<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F1114" />
    <title>آفلاین — PSM Valve</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0F1114;
        color: #F1F4F8;
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #1F2124;
        border: 1px solid rgba(220, 224, 230, 0.14);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #fff;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
      }
      .logo img { width: 56px; height: 56px; object-fit: contain; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 1.9; color: #A3A9B2; margin: 0 0 20px; }
      .en { font-size: 11px; color: #6B7280; margin-top: 14px; direction: ltr; }
      a {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 11px;
        background: linear-gradient(135deg, #C9950D, #F5C518);
        color: #1A1D21;
        font-weight: 800;
        font-size: 13px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo"><img src="/icons/icon-192.png" alt="PSM Valve" /></div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>برای مشاهدهٔ صفحه‌های ذخیره‌شده یا تلاش دوباره، اتصال خود را بررسی کنید.</p>
      <a href="/">تلاش دوباره</a>
      <div class="en">You are offline. Check your connection and try again.</div>
    </div>
  </body>
</html>
