# ============================================================
# PSM VALVE — کانفیگ کامل سایت برای Nginx پنل aaPanel
#
# جای‌گذاری خودکار (نمونه):
#   sed -e 's#__DOMAIN__#psmvalve.com#g' \
#       -e 's#__APP_DIR__#/www/wwwroot/psm-valve#g' \
#       -e 's#__APP_PORT__#3000#g' \
#       deploy/aapanel/nginx-snippet.conf > /www/server/panel/vhost/nginx/psmvalve.com.conf
#   nginx -t && nginx -s reload
#
# پیش‌نیاز: دامنه و www در aaPanel به همین سایت متصل و گواهی SSL صادر شده باشد.
# مسیر گواهی پیش‌فرض aaPanel: /www/server/panel/vhost/cert/__DOMAIN__/
# اگر مسیر گواهی متفاوت است، __CERT_DIR__ را هم جای‌گذاری کنید.
#
# ⚠️ این فایل جایگزین «کل» کانفیگ سایت می‌شود. بعد از هر تغییر SSL/دامنه در پنل،
#    کانفیگ را دوباره مقایسه/اعمال کنید (پنل ممکن است فایل را بازنویسی کند).
# ============================================================

# وب‌سوکت‌ها (قابل تکرار نیست؛ اگر پنل از قبل این map را دارد، این بلوک را حذف کنید)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP: فقط برای ACME و هدایت به HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __APP_DIR__/public;
        default_type text/plain;
    }

    location / {
        return 301 https://www.__DOMAIN__$request_uri;
    }
}

# --- بدون www → www ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://www.__DOMAIN__$request_uri;
}

# --- سایت اصلی ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root __APP_DIR__/public;

    # API آپلود تا ۵۰MB می‌پذیرد؛ سقف Nginx کمی بالاتر است.
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /www/wwwlogs/__DOMAIN__.log;
    error_log  /www/wwwlogs/__DOMAIN__.error.log;

    # دارایی‌های آپلودشده: مستقیم از دیسک، بدون عبور از Node
    location ^~ /uploads/ {
        alias __APP_DIR__/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* ^/(images|documents|hdri|logo|og|icons|fonts)/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # فایل‌های build شده Next؛ هرگز از دیسک سرو نشوند (immutable از خود Next هم می‌آید)
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # بقیهٔ درخواست‌ها (صفحات، API، پنل، sitemap/robots) → Next.js
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
