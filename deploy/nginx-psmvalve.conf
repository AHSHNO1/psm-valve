# ============================================================
# PSM VALVE — Nginx reverse proxy
# محل نصب: /etc/nginx/sites-available/psmvalve.conf
#
# فعالسازی:
#   sudo cp /var/www/psm-valve/deploy/nginx-psmvalve.conf /etc/nginx/sites-available/psmvalve.conf
#   sudo ln -s /etc/nginx/sites-available/psmvalve.conf /etc/nginx/sites-enabled/psmvalve.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# نکته: دامنه (psmvalve.com) و مسیر ریشهٔ پروژه (/var/www/psm-valve) را با واقعیت سرور همخوان کن.
# پس از اجرای certbot، مسیر گواهیها بهطور خودکار درست میشود.
# ============================================================

upstream psm_valve_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: دریافت گواهی + ریدایرکت به HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name psmvalve.com www.psmvalve.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://psmvalve.com$request_uri; }
}

# --- www → بدون www ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.psmvalve.com;

    ssl_certificate     /etc/letsencrypt/live/psmvalve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psmvalve.com/privkey.pem;

    return 301 https://psmvalve.com$request_uri;
}

# --- سایت اصلی ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name psmvalve.com;

    ssl_certificate     /etc/letsencrypt/live/psmvalve.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psmvalve.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/psm-valve/public;

    # API آپلود حداکثر ۵۰MB میپذیرد
    client_max_body_size 60m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- داراییهای استاتیک: مستقیم از دیسک (بدون عبور از Node) ---
    location ^~ /uploads/ {
        alias /var/www/psm-valve/public/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~* ^/(images|documents|hdri|logo|og)/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ^~ /_next/static/ {
        proxy_pass http://psm_valve_app;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- پنل مدیریت + لایهٔ دوم basic auth (اختیاری ولی توصیهشده) ---
    # ساخت فایل رمز:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-psm psmadmin
    # سپس دو خط auth_basic را از حالت کامنت دربیاور:
    location /admin {
        # auth_basic "PSM Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-psm;

        proxy_pass http://psm_valve_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- بقیهٔ درخواستها: Next.js ---
    # شامل robots.txt، sitemap.xml، manifest.webmanifest و icon.svg که «داینامیک» هستند
    # و نباید از دیسک سرو شوند.
    location / {
        proxy_pass http://psm_valve_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}